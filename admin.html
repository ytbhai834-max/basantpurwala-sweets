<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Admin | Basantpurwala Sweets</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4eb;color:#211b12;font:16px Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 14px 60px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font:700 34px Georgia}.panel{background:white;border:1px solid #e5d8c0;border-radius:12px;padding:18px;margin:14px 0}button{padding:10px 14px;border:0;border-radius:7px;background:#211b12;color:white;font-weight:700;cursor:pointer}button.alt{background:#e6d5b4;color:#211b12}input,select,textarea{width:100%;padding:11px;border:1px solid #d5c6ac;border-radius:7px;margin:5px 0 12px}.field label{font-size:13px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.hidden{display:none!important}.muted{color:#71695c;font-size:13px}.item,.order{border:1px solid #e5d8c0;padding:12px;border-radius:9px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.status{font-weight:bold;color:#266b45}@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main class="wrap"><div class="head"><div><div>OWNER ONLY · PROTECTED ADMIN</div><h1>Basantpurwala Sweets</h1></div><button id="logout" class="alt hidden" onclick="logout()">Logout</button></div>
<section id="loginPanel" class="panel"><h2>Owner Login</h2><p class="muted">Sirf registered owner account se login karein. Customer account se admin permission nahi milti.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit">Secure Login</button></form><p id="loginMsg" class="muted"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="row"><h2>Product Manager</h2><button onclick="newProduct()" class="alt">+ Add Product</button></div><p class="muted">Changes database mein save honge. Customer menu mein edit controls nahi hain.</p><div id="productList"></div></div><div class="panel"><h2>Incoming Orders</h2><button onclick="loadOrders()" class="alt">Refresh Orders</button><div id="orders"></div></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user=null,products=[];
function msg(t){document.getElementById('loginMsg').textContent=t}
async function checkSession(){const {data}=await sb.auth.getSession();if(data.session){user=data.session.user;await verifyAdmin()} }
async function verifyAdmin(){const {data,error}=await sb.from('shop_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await sb.auth.signOut();user=null;msg('Is account ko owner admin permission nahi hai. Shop owner se admin setup karwayein.');return}document.getElementById('loginPanel').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('logout').classList.remove('hidden');await loadProducts();await loadOrders()}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();msg('Login check ho raha hai…');const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error){msg('Login nahi hua: '+error.message);return}user=data.user;await verifyAdmin()};
async function logout(){await sb.auth.signOut();location.reload()}
async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('category').order('name');if(error){alert(error.message);return}products=data||[];document.getElementById('productList').innerHTML=products.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span>₹${p.price}</span></div><div class="muted">${esc(p.category)} · ${p.available?'Available':'Hidden'}</div><button class="alt" onclick="editProduct('${p.id}')">Edit</button> <button onclick="toggleProduct('${p.id}',${!p.available})">${p.available?'Hide':'Show'}</button> <button onclick="deleteProduct('${p.id}')">Delete</button></div>`).join('')||'<p>Abhi product nahi hain. Add Product dabayein.</p>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newProduct(){editProduct(null)}
async function editProduct(id){const p=products.find(x=>x.id===id)||{name:'',category:'mithai',description:'',image_url:'',price:0,available:true};let name=prompt('Product name',p.name);if(name===null)return;if(!name.trim()){alert('Product name required');return}let category=prompt('Category (mithai, namkeen, chaat, snacks, drinks, cakes, bakery, cold)',p.category)||'mithai';let price=prompt('Price in ₹',p.price);if(price===null)return;let description=prompt('Description',p.description||'')??'';let image_url=prompt('Image URL',p.image_url||'')??'';let available=confirm('Product available hai? OK=yes, Cancel=hide');let payload={name:name.trim(),category,price:Number(price)||0,description,image_url,available,updated_at:new Date().toISOString()};let result=id?await sb.from('products').update(payload).eq('id',id):await sb.from('products').insert(payload);if(result.error)alert('Save error: '+result.error.message);else await loadProducts()}
async function toggleProduct(id,available){const {error}=await sb.from('products').update({available,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else loadProducts()}
async function deleteProduct(id){if(!confirm('Product permanently delete karna hai?'))return;const {error}=await sb.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()}
async function loadOrders(){const el=document.getElementById('orders');el.innerHTML='Loading…';const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){el.textContent=error.message;return}el.innerHTML=(data||[]).map(o=>`<div class="order"><div class="row"><b>${esc(o.customer_name)} · ₹${o.total}</b><span>${new Date(o.created_at).toLocaleString()}</span></div><div class="muted">${esc(o.customer_phone)} · ${esc(o.order_type)} · ${esc(o.payment_method)} · Payment: ${esc(o.payment_status)}</div><p>${(o.items||[]).map(i=>`${esc(i.name)} × ${i.quantity}`).join(', ')}</p><p>${esc(o.delivery_address||'Pickup')} ${o.customer_note?'· '+esc(o.customer_note):''}</p><div class="row"><label>Status <select id="s-${o.id}"><option ${o.status==='New'?'selected':''}>New</option><option ${o.status==='Accepted'?'selected':''}>Accepted</option><option ${o.status==='Preparing'?'selected':''}>Preparing</option><option ${o.status==='Ready'?'selected':''}>Ready</option><option ${o.status==='Completed'?'selected':''}>Completed</option><option ${o.status==='Cancelled'?'selected':''}>Cancelled</option></select></label><label>Payment <select id="p-${o.id}"><option ${o.payment_status==='Pending'?'selected':''}>Pending</option><option ${o.payment_status==='Paid'?'selected':''}>Paid</option><option ${o.payment_status==='Failed'?'selected':''}>Failed</option></select></label><button onclick="saveOrder('${o.id}')">Save</button></div></div>`).join('')||'<p>No orders yet.</p>'}
async function saveOrder(id){let status=document.getElementById('s-'+id).value,payment_status=document.getElementById('p-'+id).value;const {error}=await sb.from('orders').update({status,payment_status}).eq('id',id);if(error)alert(error.message);else{alert('Order updated');loadOrders()}}
checkSession();
</script></body></html>
